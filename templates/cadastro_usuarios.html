{% extends "base_com_menu.html" %}

{% block titulo %}Cadastro de Usuários - MeetCars{% endblock %}


{% block conteudo %}
<h2 class="fw-bold mb-3">Cadastro de Usuários</h2>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <!-- Formulário só visual: o botão Salvar não envia nada (o site não é funcional) -->
        <form>
            <div class="row g-3">

                <div class="col-12 col-md-6">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" id="nome" class="form-control">
                </div>
                <div class="col-12 col-md-6">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" class="form-control">
                </div>

                <div class="col-12 col-md-3">
                    <label for="celular" class="form-label">Celular:</label>
                    <input type="text" id="celular" class="form-control">
                </div>
                <div class="col-12 col-md-3">
                    <label for="nascimento" class="form-label">Data de Nascimento:</label>
                    <input type="date" id="nascimento" class="form-control">
                </div>
                <div class="col-12 col-md-3">
                    <label for="cpf" class="form-label">CPF:</label>
                    <input type="text" id="cpf" class="form-control">
                </div>
                <div class="col-12 col-md-3">
                    <label for="nivel" class="form-label text-danger fw-bold">Nível de Acesso:</label>
                    <select id="nivel" class="form-select">
                        <option selected>-- ESCOLHA --</option>
                        <option>Usuário</option>
                        <option>Administrador</option>
                    </select>
                </div>

                <div class="col-12 col-md-3">
                    <label for="cep" class="form-label">CEP:</label>
                    <input type="text" id="cep" class="form-control">
                </div>
                <div class="col-12 col-md-7">
                    <label for="endereco" class="form-label">Endereço:</label>
                    <input type="text" id="endereco" class="form-control">
                </div>
                <div class="col-12 col-md-2">
                    <label for="numero" class="form-label">Número:</label>
                    <input type="text" id="numero" class="form-control">
                </div>

                <div class="col-12 col-md-4">
                    <label for="complemento" class="form-label">Complemento:</label>
                    <input type="text" id="complemento" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                    <label for="cidade" class="form-label">Cidade:</label>
                    <input type="text" id="cidade" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                    <label for="estado" class="form-label">Estado:</label>
                    <select id="estado" class="form-select">
                        <option selected>-- ESCOLHA --</option>
                        <option>AC</option><option>AL</option><option>AP</option><option>AM</option>
                        <option>BA</option><option>CE</option><option>DF</option><option>ES</option>
                        <option>GO</option><option>MA</option><option>MT</option><option>MS</option>
                        <option>MG</option><option>PA</option><option>PB</option><option>PR</option>
                        <option>PE</option><option>PI</option><option>RJ</option><option>RN</option>
                        <option>RS</option><option>RO</option><option>RR</option><option>SC</option>
                        <option>SP</option><option>SE</option><option>TO</option>
                    </select>
                </div>

            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <a href="{{ url_for('listagem_usuarios') }}" class="btn btn-link text-decoration-none">Voltar</a>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <button type="button" class="btn btn-success">Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
