<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}MeetCars{% endblock %}</title>

    <!-- Bootstrap (CSS) e Bootstrap Icons (ícones do menu) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Nosso CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
<div class="layout-menu">

    <!-- ===== MENU LATERAL ===== -->
    <aside class="menu-lateral">

        <!-- Nome da loja (leva ao dashboard) -->
        <a href="{{ url_for('dashboard') }}" class="marca-texto d-block text-center fs-2 pb-2">MeetCars</a>

        <div class="menu-saudacao">Bem-vindo(a)!</div>

        <!-- request.endpoint = nome da função da rota atual.
             Usamos para pintar o link da página onde o usuário está ("ativo"). -->
        <nav class="mt-2">
            <a href="{{ url_for('dashboard') }}"
               class="menu-link {% if request.endpoint == 'dashboard' %}ativo{% endif %}">
                <i class="bi bi-shop"></i> Comércio
            </a>
            <a href="{{ url_for('listagem_usuarios') }}"
               class="menu-link {% if request.endpoint == 'listagem_usuarios' %}ativo{% endif %}">
                <i class="bi bi-people"></i> Listagem de Usuários
            </a>
            <a href="{{ url_for('cadastro_usuarios') }}"
               class="menu-link {% if request.endpoint == 'cadastro_usuarios' %}ativo{% endif %}">
                <i class="bi bi-person-plus"></i> Cadastro de Usuários
            </a>
            <a href="{{ url_for('listagem_vendas') }}"
               class="menu-link {% if request.endpoint == 'listagem_vendas' %}ativo{% endif %}">
                <i class="bi bi-card-list"></i> Listagem de Vendas
            </a>
            <a href="{{ url_for('cadastro_vendas') }}"
               class="menu-link {% if request.endpoint == 'cadastro_vendas' %}ativo{% endif %}">
                <i class="bi bi-plus-circle"></i> Cadastro de Vendas
            </a>
        </nav>

        <!-- Sair volta para a tela de login (rota "inicio") -->
        <a href="{{ url_for('inicio') }}" class="menu-link menu-sair">
            <i class="bi bi-box-arrow-left"></i> Sair
        </a>
    </aside>

    <!-- ===== CONTEÚDO: a tag main fica dentro de cada página ===== -->
    <div class="conteudo-principal">

        {% for tipo, mensagem in get_flashed_messages(with_categories=true) %}
        <div class="alert alert-{{ tipo }} alert-dismissible fade show" role="alert">
          {{ mensagem }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
        {% endfor %}

        {% block conteudo %}{% endblock %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
