{% extends "base_com_menu.html" %}

{% block titulo %}Cadastro de Vendas - MeetCars{% endblock %}

{% block conteudo %}
<h2 class="fw-bold mb-3">Cadastro de Vendas</h2>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4">
        <!-- Formulário só visual: o botão Salvar não envia nada (o site não é funcional) -->
        <form>
            <div class="row g-3">

                <div class="col-12 col-md-4">
                    <label for="marca" class="form-label">Marca:</label>
                    <input type="text" id="marca" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                    <label for="modelo" class="form-label">Modelo:</label>
                    <input type="text" id="modelo" class="form-control">
                </div>
                <div class="col-6 col-md-2">
                    <label for="ano" class="form-label">Ano:</label>
                    <input type="number" id="ano" class="form-control">
                </div>
                <div class="col-6 col-md-2">
                    <label for="cor" class="form-label">Cor:</label>
                    <input type="text" id="cor" class="form-control">
                </div>

                <div class="col-12 col-md-4">
                    <label for="km" class="form-label">Quilometragem:</label>
                    <input type="number" id="km" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                    <label for="valor" class="form-label">Valor (R$):</label>
                    <input type="text" id="valor" class="form-control">
                </div>
                <div class="col-12 col-md-4">
                    <label for="status" class="form-label">Status:</label>
                    <select id="status" class="form-select">
                        <option selected>-- ESCOLHA --</option>
                        <option>Disponível</option>
                        <option>Vendido</option>
                    </select>
                </div>

            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <a href="{{ url_for('listagem_vendas') }}" class="btn btn-link text-decoration-none">Voltar</a>
                <button type="reset" class="btn btn-secondary">Limpar</button>
                <button type="button" class="btn btn-success">Salvar</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
