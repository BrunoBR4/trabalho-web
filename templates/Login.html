{% extends "layout/base_limpa.html" %}

{% block titulo %}Login - MeetCars{% endblock %}

{% block conteudo %}
<main class="container min-vh-100 d-flex align-items-center">
    <div class="col-12 col-md-8 col-lg-4 mx-auto">

        <div class="card card-login shadow-sm">

            <!-- Topo do card com o nome da loja -->
            <div class="card-header text-center py-3">
                <div class="marca-texto fs-1">MeetCars</div>
            </div>

            <div class="card-body p-4">
                <h2 class="text-center fw-bold mb-4">Login</h2>

                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label">E-mail:</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="Digite seu e-mail">
                    </div>

                    <div class="mb-2">
                        <label for="senha" class="form-label">Senha:</label>
                        <input type="password" class="form-control" id="senha" name="senha"
                               placeholder="Digite sua senha">
                    </div>

                    <!-- Recuperar Senha: logo abaixo do campo, pequeno e à direita -->
                    <div class="text-end mb-3">
                        <a href="#" class="link-recuperar">Recuperar senha</a>
                    </div>

                    <!-- Por enquanto "Entrar" é um link direto para o dashboard (sem verificação) -->
                    <a href="{{ url_for('dashboard') }}" class="btn btn-primaria w-100 mb-3">Entrar</a>
                    <!-- Só visual: não faz nada por enquanto -->
                    <button type="button" class="btn btn-secundaria w-100">Cadastrar</button>
                </form>
            </div>
        </div>

    </div>
</main>
{% endblock %}
