<div class="comercio-largura">

    <!-- Frase de destaque, centralizada -->
    <h2 class="comercio-titulo text-center fw-bold mb-4">
        <span class="destaque">Compre</span> novos veículos e
        <span class="destaque">Venda</span> seus veículos aqui!
    </h2>

    <!-- Barra de pesquisa + Filtrar (apenas visual, não funciona) -->
    <div class="barra-comercio d-flex flex-wrap gap-2 mb-4">
        <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" placeholder="Pesquisar por modelo ou marca...">
        </div>
        <button type="button" class="btn btn-primaria"><i class="bi bi-funnel"></i> Filtrar</button>
    </div>

    {# Anúncios: o for repete este bloco para cada item da lista ANUNCIOS (app.py) #}
    <div class="row g-4">
        {% for a in anuncios %}
        <div class="col-12 col-md-6 col-xl-4">
            <div class="card anuncio shadow-sm h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="anuncio-modelo mb-2">{{ a.modelo }}</h5>

                    <p class="anuncio-info mb-1">Marca: {{ a.marca }}</p>
                    <p class="anuncio-info mb-1">Ano: {{ a.ano }}</p>
                    <p class="anuncio-info mb-3">Quilometragem: {{ a.km }} km</p>

                    <!-- mt-auto empurra o preço para o fim, alinhando todos os cards -->
                    <div class="anuncio-preco mt-auto">{{ a.preco }}</div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>
